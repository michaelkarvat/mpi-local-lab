name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Each optional dependency is switched off in turn, because "it builds on my
  # cluster" is not the same claim as "it builds". The serial backend must work
  # with nothing installed at all.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: serial only
            flags: -DMSEARCH_ENABLE_OPENMP=OFF -DMSEARCH_ENABLE_MPI=OFF -DMSEARCH_ENABLE_CUDA=OFF
            mpi: false
          - name: openmp
            flags: -DMSEARCH_ENABLE_MPI=OFF -DMSEARCH_ENABLE_CUDA=OFF
            mpi: false
          - name: openmp + mpi
            flags: -DMSEARCH_ENABLE_CUDA=OFF
            mpi: true

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI
        if: matrix.mpi
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMSEARCH_WERROR=ON ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Backend equivalence on the reference input
        run: ./build/msearch --verify -i tests/data/reference.txt

      - name: Reject a bad input cleanly
        run: |
          printf '1.0\n1\n7 3\n1 2 3\n' > bad.txt
          if ./build/msearch -i bad.txt -o /dev/null; then
            echo "expected a non-zero exit for malformed input"; exit 1
          fi

  # The CUDA backend cannot run without a GPU, but it must always compile --
  # the kernels share include/msearch/metric.h with the CPU backends, so a
  # change there can break nvcc without touching any CPU build.
  cuda-compile:
    name: cuda (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DMSEARCH_ENABLE_MPI=OFF -DCMAKE_CUDA_ARCHITECTURES=75
          cmake --build build --parallel
      - name: Confirm the CUDA backend is compiled in
        run: ./build/msearch --list-backends | grep -q '^cuda'

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck
      - name: Formatting
        run: |
          find src include tests -name '*.c' -o -name '*.h' -o -name '*.cu' \
            | xargs clang-format --dry-run --Werror
      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --enable=warning,portability \
                   --inline-suppr --suppress=missingIncludeSystem \
                   -I include -I src src
      - name: Generator and benchmark harness are importable
        run: |
          python3 tools/gen_input.py --pictures 2 --picture-size 16 --objects 2 \
                                     --object-size 3 --seed 1 -o /dev/null
          python3 -c "import ast,sys; [ast.parse(open(f).read()) for f in ['bench/run_bench.py','tools/gen_input.py']]"
