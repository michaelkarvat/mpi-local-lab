# OpenMPI defaults for containers on a Docker bridge network.
#
# Installed to /etc/openmpi/openmpi-mca-params.conf, so every mpirun in the
# cluster picks these up without anyone passing --mca flags.
#
# --------------------------------------------------------------------------
# Why the interface pinning is not optional
# --------------------------------------------------------------------------
# A container attached to a compose network is multi-homed: it has lo, eth0,
# and one more interface for every additional network. OpenMPI's TCP components
# probe all of them and will happily pick one that the peer cannot route to.
# When that happens mpirun does not fail -- it blocks, with no error, until you
# kill it. It is the single most common way a containerised MPI setup appears
# broken, and it looks like a bug in the user's program.
#
# Pinning both the data path (btl_tcp) and the out-of-band startup channel
# (oob_tcp) to eth0 removes the guesswork. eth0 is the interface for the single
# network compose.yaml attaches; if you add a second network, revisit this.
btl_tcp_if_include = eth0
oob_tcp_if_include = eth0

# The launcher. Processes on other nodes are started over ssh, which is why
# the dev image runs sshd and ships a key pair -- see the Dockerfile.
plm_rsh_agent = ssh

# Shared-memory transport between ranks *inside* one container. The default
# single-copy mechanism needs CAP_SYS_PTRACE, which containers do not get, and
# without this line OpenMPI prints a warning on every run. The cost of turning
# it off is a second copy on large intra-node messages -- irrelevant at the
# scale anything in this repository runs at, and worth it to keep `docker run`
# free of --cap-add flags.
btl_vader_single_copy_mechanism = none
